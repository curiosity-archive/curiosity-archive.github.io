[params]
  backgroundImage = 'img/backgrounds.png'
  description = "A collection of AI-generated stories about science, technology, history, and the world."
  mainSections = ["posts"]

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Posts"
  pageRef = "/posts/"
  weight = 20
